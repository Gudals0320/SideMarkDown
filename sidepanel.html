<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideMarkDown</title>
  </head>
  <body>
    <header class="toolbar">
      <strong>SideMarkDown</strong>
      <div class="toolbar-actions">
        <p id="status" role="status" aria-live="polite"></p>
        <button
          id="copy"
          type="button"
          aria-label="Copy canonical Markdown"
          title="Copy canonical Markdown"
        >
          Markdown
        </button>
        <button
          id="copy-compact"
          type="button"
          aria-label="Copy compact Markdown"
          title="Copy compact Markdown"
        >
          Compact
        </button>
        <button id="clear" type="button">Clear</button>
      </div>
    </header>
    <main id="editor" aria-label="Markdown editor"></main>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
