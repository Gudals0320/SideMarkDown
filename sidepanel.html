<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SideMarkDown</title>
  </head>
  <body>
    <header class="app-header">
      <div class="topbar">
        <strong>SideMarkDown</strong>
        <p id="status" role="status" aria-live="polite"></p>
      </div>
      <nav class="tabs" role="tablist" aria-label="SideMarkDown sections">
        <button
          id="tab-editor"
          class="tab"
          type="button"
          role="tab"
          aria-selected="true"
          aria-controls="editor-view"
        >
          Editor
        </button>
        <button
          id="tab-library"
          class="tab"
          type="button"
          role="tab"
          aria-selected="false"
          aria-controls="library-view"
        >
          Library
        </button>
      </nav>
      <div id="editor-actions" class="toolbar-actions">
        <button
          id="copy"
          type="button"
          aria-label="Copy canonical Markdown"
          title="Copy canonical Markdown"
        >
          Markdown
        </button>
        <button
          id="copy-compact"
          type="button"
          aria-label="Copy compact Markdown"
          title="Copy compact Markdown"
        >
          Compact
        </button>
        <button id="clear" class="draft-action" type="button">Clear</button>
        <button id="save-draft" class="draft-action" type="button">Save</button>
        <button id="save-document" class="document-action" type="button" hidden>
          Save
        </button>
        <button id="cancel-document" class="document-action" type="button" hidden>
          Cancel
        </button>
        <button
          id="delete-document"
          class="document-action danger-button"
          type="button"
          hidden
        >
          Delete
        </button>
      </div>
    </header>
    <main
      id="editor-view"
      role="tabpanel"
      aria-labelledby="tab-editor"
    >
      <p id="editor-mode" class="editor-mode" hidden>Editing saved document</p>
      <div id="editor" aria-label="Markdown editor"></div>
    </main>
    <section
      id="library-view"
      role="tabpanel"
      aria-labelledby="tab-library"
      hidden
    >
      <p id="library-empty" class="empty-state">No saved documents yet.</p>
      <div id="library-list" class="library-list"></div>
    </section>
    <script type="module" src="/src/sidepanel.ts"></script>
  </body>
</html>
